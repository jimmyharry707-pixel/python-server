# TLS termination + reverse proxy for the Baymax API.
# Certs come from the host's Let's Encrypt directory; certbot renews them via
# --webroot (/var/www/certbot) and reloads nginx with a deploy hook.

server {
    listen 80;
    server_name app.example.com;
    # Let's Encrypt HTTP-01 challenges (certbot --webroot writes here).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 200m;

    # Public user portal: download page + release / cert files.
    location = /userportal {
        return 301 /userportal/;
    }

    location /userportal/ {
        alias /usr/share/nginx/userportal/;
        index index.html;
    }

    location /userportal/downloads/ {
        alias /usr/share/nginx/userportal/downloads/;
        add_header Content-Disposition "attachment";
    }

    # Large release uploads (CareerCraft.exe ~100MB) go through the API.
    location /api/v1/admin/api/cc-releases/upload {
        client_max_body_size 200m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Daily review viewer: uploaded resumes and form captures are shown inside
    # the review page, so these responses may be framed by this site only.
    # add_header here replaces the server-level headers, so all are repeated.
    location /api/v1/review/files/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# Absurd Technologies careers site (separate frontend + API stack).
server {
    listen 80;
    server_name career.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name career.example.com;

    # Resolve the optional careers container at request time. This keeps the
    # primary app virtual host available while careers is deploying/restarting.
    resolver 127.0.0.11 ipv6=off valid=10s;

    ssl_certificate     /etc/letsencrypt/live/career.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/career.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 12m;

    location / {
        set $careers_upstream http://careers-web:8080;
        proxy_pass $careers_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }
}
